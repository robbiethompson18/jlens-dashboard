[project]
name = "jlens-visualizer"
version = "0.1.0"
description = "Per-layer J-lens (Jacobian lens) logit graphs for multi-hop prompts like 'how many legs does the creature that makes webs have'"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlens_visualizer"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens" }

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
pod = [
    "jlens",
    "torch>=2.14.1",
    "transformers>=5.5",
]
