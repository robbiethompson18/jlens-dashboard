[project]
name = "jlens-dashboard"
version = "0.1.0"
description = "Interactive J-lens dashboard: hover any token of a Qwen transcript to see logit/J-lens top-20 readouts across layers, and grep the readouts."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlens_dashboard"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
pod = [
    "jlens>=0.1.0",
    "torch>=2.9",
    "transformers>=5.5",
]

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens" }
